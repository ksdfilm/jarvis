<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#01070c">
<title>กล้องอ่าน + แปล · KSD LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/lab.css">
<style>
  main { max-width: 1280px; margin: 0 auto; padding: 12px 16px 40px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 10px 12px 40px; } }
  .stage { aspect-ratio: 4 / 3; width: 100%; }
  @media (max-width: 700px) { .stage { aspect-ratio: 3 / 4; max-height: 62vh; } }
  .stage canvas { object-fit: contain; display: none; }
  .stage.frozen canvas { display: block; }
  .stage.frozen video { visibility: hidden; }
  .reticle { position: absolute; inset: 10%; border: 1px solid rgba(60, 231, 255, .35); pointer-events: none; }
  .reticle::before, .reticle::after { content: ""; position: absolute; width: 22px; height: 22px; border: 2px solid var(--c); }
  .reticle::before { left: -2px; top: -2px; border-right: 0; border-bottom: 0; }
  .reticle::after { right: -2px; bottom: -2px; border-left: 0; border-top: 0; }
  .stage.frozen .reticle { display: none; }
  .nocam { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 20px; color: var(--dim); }
  .stage.nocamera .nocam { display: grid; }
  .stage.frozen .nocam { display: none; }
  .hud { position: absolute; left: 8px; top: 8px; font-family: var(--mono); font-size: 12px; color: var(--c); background: rgba(0, 10, 16, .7); padding: 3px 8px; border: 1px solid var(--line); }
  .qr { position: absolute; left: 8px; right: 8px; bottom: 8px; display: none; gap: 8px; align-items: center; background: rgba(0, 14, 22, .92); border: 1px solid var(--ok); padding: 8px 10px; box-shadow: 0 0 18px rgba(61, 255, 154, .25); }
  .qr.show { display: flex; }
  .qr span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ok); font-family: var(--mono); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .controls .btn.primary { flex: 1 1 160px; }
  .langs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .langs label { border: 1px solid var(--line); padding: 5px 10px; cursor: pointer; font-size: 14px; user-select: none; }
  .langs input { display: none; }
  .langs label:has(input:checked) { background: rgba(60, 231, 255, .15); border-color: var(--c); color: var(--c); }
  .side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  textarea { width: 100%; min-height: 120px; resize: vertical; font-size: 15px; line-height: 1.55; }
  #tr { min-height: 120px; background: rgba(0, 0, 0, .4); border: 1px solid var(--line); padding: 10px; white-space: pre-wrap; font-size: 16px; line-height: 1.6; color: #e6fbff; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  .prog { height: 4px; background: rgba(60, 231, 255, .12); margin-top: 8px; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--c); box-shadow: 0 0 8px var(--c); transition: width .2s; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-top: 6px; min-height: 1.2em; }
  .err { color: var(--bad); }
  h2 small { color: var(--dim); font-weight: normal; font-size: 12px; margin-left: 6px; }
</style>
</head>
<body class="scanlines">
<main>
  <section>
    <div class="stage" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="frame"></canvas>
      <div class="reticle"></div>
      <div class="nocam">ไม่มีกล้อง — กด “อัปโหลดรูป” เพื่อเลือกรูปภาพแทน</div>
      <div class="hud" id="hud">LIVE</div>
      <div class="qr" id="qr"><b>QR</b><span id="qrText"></span><button class="btn" id="qrOpen">เปิด</button><button class="btn" id="qrCopy">คัดลอก</button><button class="btn" id="qrX">✕</button></div>
    </div>
    <div class="controls">
      <button class="btn primary big" id="shoot">📸 ถ่ายแล้วอ่าน</button>
      <button class="btn" id="upload">🖼 อัปโหลดรูป</button>
      <button class="btn" id="live" hidden>↺ กลับไปกล้อง</button>
      <button class="btn" id="flip">🔄 สลับกล้อง</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <div class="langs" id="langs"></div>
    <div class="prog"><i id="bar"></i></div>
    <div class="status" id="status">พร้อม</div>
  </section>
  <section class="side">
    <div class="panel">
      <h2>ข้อความที่อ่านได้ <small id="conf"></small></h2>
      <textarea id="text" placeholder="ถ่ายรูปป้าย/เอกสาร แล้วข้อความจะขึ้นที่นี่ (แก้ไขได้ก่อนแปล)"></textarea>
      <div class="row">
        <button class="btn" id="copyText">คัดลอก</button>
        <button class="btn" id="speakSrc">🔊 อ่านต้นฉบับ</button>
        <button class="btn primary" id="translate">แปลเป็นไทย ▸</button>
      </div>
    </div>
    <div class="panel">
      <h2>คำแปลภาษาไทย <small>MyMemory · ฟรี ~5,000 ตัวอักษร/วัน</small></h2>
      <div id="tr"></div>
      <div class="row">
        <button class="btn" id="copyTr">คัดลอก</button>
        <button class="btn" id="speakTr">🔊 อ่านออกเสียง</button>
        <button class="btn" id="stopSpeak">■ หยุด</button>
      </div>
      <p class="note">OCR ประมวลผลในเครื่องด้วย Tesseract.js (ดาวน์โหลดข้อมูลภาษาครั้งแรก 1–4 MB ต่อภาษา) · การแปลส่งเฉพาะข้อความไปที่ MyMemory</p>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
<script type="module">
import { bar, gate, camera, store, toast, $, isIOS } from '../common/lab.js';

bar('LENS', 'กล้องอ่าน + แปล · OCR ในเครื่อง');

const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const LANGS = [
  ['eng', 'อังกฤษ', 'en'], ['tha', 'ไทย', 'th'], ['jpn', 'ญี่ปุ่น', 'ja'],
  ['chi_sim', 'จีน (ตัวย่อ)', 'zh-CN'], ['kor', 'เกาหลี', 'ko'],
];
const MAX_SIDE = 2000;           // downscale big photos (iPhone memory + OCR speed)

const video = $('#video'), frame = $('#frame'), stage = $('#stage'), fctx = frame.getContext('2d');
const status = (t, cls = '') => { const s = $('#status'); s.textContent = t; s.className = 'status ' + cls; };
const progress = p => $('#bar').style.width = Math.round(p * 100) + '%';

// ---------- language chips ----------
let chosen = store.get('lens.langs', ['eng']);
$('#langs').innerHTML = LANGS.map(([c, n]) => `<label><input type="checkbox" value="${c}" ${chosen.includes(c) ? 'checked' : ''}>${n}</label>`).join('');
$('#langs').onchange = () => {
  chosen = [...document.querySelectorAll('#langs input:checked')].map(i => i.value);
  if (!chosen.length) { chosen = ['eng']; document.querySelector('#langs input[value=eng]').checked = true; }
  store.set('lens.langs', chosen);
};

// ---------- camera ----------
let facing = 'environment', hasCam = false;
async function startCam() {
  const r = await camera(video, { facing, w: 1920, h: 1080 });
  // never mirror: text must read the right way round for OCR
  hasCam = true; stage.classList.remove('nocamera');
}
await gate({
  title: 'LENS',
  lines: ['ส่องกล้องหลังไปที่ป้าย เมนู หรือเอกสาร แล้วกด “ถ่ายแล้วอ่าน”', 'อ่านได้หลายภาษา แล้วแปลเป็นภาษาไทย พร้อมอ่านออกเสียง', 'เจอ QR code จะขึ้นลิงก์ให้กดเปิดอัตโนมัติ', 'ไม่มีกล้องก็อัปโหลดรูปได้'],
  needs: ['camera'], button: '▶ เปิดกล้อง',
  onStart: async () => {
    try { await startCam(); }
    catch (e) { console.warn(e); stage.classList.add('nocamera'); toast('เปิดกล้องไม่ได้ — ใช้โหมดอัปโหลดรูปแทน'); }
  },
});
$('#flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startCam(); toLive(); } catch (e) { toast('สลับกล้องไม่ได้: ' + (e.message || e)); }
};

// ---------- frozen frame + OCR ----------
let img = null; // { canvas } current frozen image at OCR resolution
function freezeFrom(source, w, h, mirror = false) {
  const s = Math.min(1, MAX_SIDE / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  const x = c.getContext('2d');
  if (mirror) { x.translate(c.width, 0); x.scale(-1, 1); }
  x.drawImage(source, 0, 0, c.width, c.height);
  img = c;
  frame.width = c.width; frame.height = c.height;
  fctx.drawImage(c, 0, 0);
  stage.classList.add('frozen');
  $('#hud').textContent = `ภาพนิ่ง ${c.width}×${c.height}`;
  $('#live').hidden = !hasCam;
  return c;
}
function toLive() {
  stage.classList.remove('frozen'); $('#live').hidden = true; $('#hud').textContent = 'LIVE';
}
$('#live').onclick = toLive;

$('#shoot').onclick = async () => {
  if (!hasCam || !video.videoWidth) { $('#file').click(); return; }
  const c = freezeFrom(video, video.videoWidth, video.videoHeight);
  scanQR(c);
  await ocr(c);
};
$('#upload').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (f) await processBlob(f);
};
async function processBlob(blob) {
  let bmp;
  try { bmp = await createImageBitmap(blob); }
  catch { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(blob); }); }
  const c = freezeFrom(bmp, bmp.width, bmp.height);
  bmp.close?.();
  scanQR(c);
  await ocr(c);
}

let Tess, worker, workerLangs = '', busy = false;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('โหลดสคริปต์ไม่ได้: ' + src)); document.head.appendChild(s); });
}
async function getWorker(langs) {
  if (!window.Tesseract) await loadScript(TESS);
  Tess = window.Tesseract;
  const key = langs.join('+');
  if (worker && workerLangs === key) return worker;
  if (worker) { await worker.terminate(); worker = null; }
  status('กำลังโหลดเครื่องอ่าน OCR + ข้อมูลภาษา ' + key + ' …');
  worker = await Tess.createWorker(langs, 1, {
    logger: m => {
      if (m.status === 'recognizing text') { progress(m.progress); status(`กำลังอ่าน… ${Math.round(m.progress * 100)}%`); }
      else if (m.progress != null) { progress(m.progress); status(thStatus(m.status) + ` ${Math.round(m.progress * 100)}%`); }
    },
  });
  workerLangs = key;
  return worker;
}
const thStatus = s => ({
  'loading tesseract core': 'โหลดแกน OCR', 'initializing tesseract': 'เริ่มระบบ OCR', 'loading language traineddata': 'โหลดข้อมูลภาษา',
  'loading language traineddata (from cache)': 'โหลดข้อมูลภาษา (แคช)', 'initializing api': 'เตรียม API', 'initialized api': 'พร้อม',
}[s] || s);

async function ocr(c) {
  if (busy) return toast('กำลังอ่านอยู่ รอสักครู่');
  busy = true; $('#shoot').disabled = true;
  const t0 = performance.now();
  try {
    const w = await getWorker(chosen);
    // CJK/Thai don't use spaces between words — keep tesseract from inserting them
    const noSpace = chosen.some(l => ['tha', 'jpn', 'chi_sim'].includes(l)) && !chosen.includes('eng') && !chosen.includes('kor');
    await w.setParameters({ preserve_interword_spaces: noSpace ? '0' : '1' });
    const { data } = await w.recognize(c);
    drawBoxes(c, data.words || []);
    let text = (data.text || '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    if (noSpace) text = text.replace(/(?<=[฀-๿぀-ヿ一-鿿]) (?=[฀-๿぀-ヿ一-鿿])/g, '');
    $('#text').value = text;
    $('#conf').textContent = text ? `ความมั่นใจ ${Math.round(data.confidence)}% · ${data.words?.length || 0} คำ · ${((performance.now() - t0) / 1000).toFixed(1)} วิ` : '';
    progress(1);
    if (!text) { status('ไม่พบตัวหนังสือ — ลองถ่ายให้ใกล้และชัดขึ้น หรือเลือกภาษาให้ตรง', 'err'); return; }
    status('อ่านเสร็จ ✓');
    if (chosen.length === 1 && chosen[0] === 'tha') $('#tr').textContent = text; else translate();
  } catch (e) {
    console.error(e); status('OCR ล้มเหลว: ' + (e.message || e), 'err');
  } finally { busy = false; $('#shoot').disabled = false; }
}
function drawBoxes(c, words) {
  fctx.drawImage(c, 0, 0);
  fctx.fillStyle = 'rgba(0,0,0,.25)'; fctx.fillRect(0, 0, c.width, c.height);
  fctx.drawImage(c, 0, 0);
  const lw = Math.max(1.5, c.width / 600);
  for (const w of words) {
    if (!w.text.trim()) continue;
    const { x0, y0, x1, y1 } = w.bbox;
    const good = w.confidence > 70;
    fctx.fillStyle = good ? 'rgba(60,231,255,.14)' : 'rgba(255,200,69,.14)';
    fctx.strokeStyle = good ? '#3ce7ff' : '#ffc845';
    fctx.lineWidth = lw;
    fctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    fctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
  }
}

// ---------- translation (MyMemory) ----------
function chunks(text, maxBytes = 450) {
  const enc = new TextEncoder(), out = [];
  const parts = text.split(/(?<=[.!?。！？\n])\s*/);
  let cur = '';
  const push = s => { if (s.trim()) out.push(s.trim()); };
  for (let p of parts) {
    while (enc.encode(p).length > maxBytes) {       // very long sentence: hard split on words/chars
      let cut = p.length;
      while (enc.encode(p.slice(0, cut)).length > maxBytes) cut = Math.floor(cut * 0.8);
      const sp = p.lastIndexOf(' ', cut); if (sp > cut * 0.5) cut = sp;
      push(cur); cur = ''; push(p.slice(0, cut)); p = p.slice(cut);
    }
    if (enc.encode(cur + ' ' + p).length > maxBytes) { push(cur); cur = p; } else cur = cur ? cur + ' ' + p : p;
  }
  push(cur);
  return out;
}
function srcLang() {
  const t = chosen.find(l => l !== 'tha') || 'eng';
  return LANGS.find(l => l[0] === t)[2];
}
const unescape = s => { const d = document.createElement('textarea'); d.innerHTML = s; return d.value; };
let trBusy = false;
async function translate() {
  const text = $('#text').value.trim();
  if (!text) return toast('ยังไม่มีข้อความให้แปล');
  if (trBusy) return;
  const src = srcLang();
  if (src === 'th') { $('#tr').textContent = text; return; }
  trBusy = true; $('#translate').disabled = true;
  const out = $('#tr'); out.textContent = ''; out.classList.remove('err');
  const parts = chunks(text.replace(/\n+/g, '\n'));
  const res = [];
  try {
    for (let i = 0; i < parts.length; i++) {
      status(`กำลังแปล ${i + 1}/${parts.length} …`);
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(parts[i])}&langpair=${encodeURIComponent(src)}|th`;
      let j;
      try { j = await (await fetch(url)).json(); }
      catch { throw new Error('เชื่อมต่อบริการแปลไม่ได้ (ออฟไลน์?)'); }
      const msg = String(j.responseDetails || '') + ' ' + String(j.responseData?.translatedText || '');
      if (j.responseStatus == 429 || /USED ALL AVAILABLE FREE TRANSLATIONS|QUOTA/i.test(msg)) throw Object.assign(new Error('quota'), { quota: true });
      if (j.responseStatus != 200) throw new Error(j.responseDetails || 'แปลไม่สำเร็จ');
      res.push(unescape(j.responseData.translatedText).trim());
      out.textContent = res.join('\n');
    }
    status('แปลเสร็จ ✓');
  } catch (e) {
    console.warn(e);
    const m = e.quota ? 'โควตาแปลฟรีของวันนี้หมดแล้ว (MyMemory ~5,000 ตัวอักษร/วัน ต่อ IP) — ลองใหม่พรุ่งนี้ หรือใช้เครือข่ายอื่น' : 'แปลไม่สำเร็จ: ' + e.message;
    out.textContent = (res.length ? res.join('\n') + '\n\n' : '') + '⚠ ' + m;
    status(m, 'err');
  } finally { trBusy = false; $('#translate').disabled = false; }
}
$('#translate').onclick = translate;

// ---------- copy / speak ----------
async function copy(t) {
  if (!t.trim()) return toast('ไม่มีข้อความ');
  try { await navigator.clipboard.writeText(t); toast('คัดลอกแล้ว'); }
  catch { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('คัดลอกแล้ว'); }
}
$('#copyText').onclick = () => copy($('#text').value);
$('#copyTr').onclick = () => copy($('#tr').textContent.replace(/\n\n⚠.*$/s, ''));

const synth = window.speechSynthesis;
const voiceFor = lang => synth?.getVoices().find(v => v.lang.replace('_', '-').toLowerCase().startsWith(lang.toLowerCase()));
function speak(text, lang) {
  if (!synth) return toast('เบราว์เซอร์นี้อ่านออกเสียงไม่ได้');
  text = text.trim(); if (!text) return toast('ไม่มีข้อความ');
  synth.cancel();
  const bcp = { th: 'th-TH', en: 'en-US', ja: 'ja-JP', 'zh-CN': 'zh-CN', ko: 'ko-KR' }[lang] || lang;
  const v = voiceFor(bcp.slice(0, 2));
  if (!v && lang === 'th') toast('ไม่พบเสียงภาษาไทยในเครื่อง — ติดตั้งเสียงไทยในการตั้งค่าระบบ');
  // long text: split so iOS/Chrome don't cut off after ~15 s
  for (const part of text.match(/[^.!?。\n]{1,180}[.!?。\n]?/g) || [text]) {
    const u = new SpeechSynthesisUtterance(part);
    u.lang = bcp; if (v) u.voice = v; u.rate = lang === 'th' ? 1 : 0.95;
    synth.speak(u);
  }
}
synth?.getVoices(); synth && (synth.onvoiceschanged = () => synth.getVoices());
$('#speakTr').onclick = () => speak($('#tr').textContent.replace(/\n\n⚠.*$/s, ''), 'th');
$('#speakSrc').onclick = () => speak($('#text').value, srcLang());
$('#stopSpeak').onclick = () => synth?.cancel();

// ---------- QR ----------
let bd = null;
if ('BarcodeDetector' in window) {
  try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')) bd = new BarcodeDetector({ formats: ['qr_code'] }); } catch {}
}
const qc = document.createElement('canvas'), qx = qc.getContext('2d', { willReadFrequently: true });
let lastQR = '';
async function detectQR(src, w, h) {
  if (bd) { try { const r = await bd.detect(src); return r[0]?.rawValue || ''; } catch {} }
  if (!window.jsQR) return '';
  const s = Math.min(1, 640 / Math.max(w, h));
  qc.width = Math.round(w * s); qc.height = Math.round(h * s);
  qx.drawImage(src, 0, 0, qc.width, qc.height);
  const d = qx.getImageData(0, 0, qc.width, qc.height);
  return window.jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' })?.data || '';
}
function showQR(t) {
  if (!t || t === lastQR) return;
  lastQR = t;
  $('#qrText').textContent = t; $('#qr').classList.add('show');
  const isUrl = /^https?:\/\//i.test(t);
  $('#qrOpen').hidden = !isUrl;
  navigator.vibrate?.(60);
}
async function scanQR(c) { showQR(await detectQR(c, c.width, c.height)); }
$('#qrOpen').onclick = () => { if (confirm('เปิดลิงก์นี้?\n' + lastQR)) window.open(lastQR, '_blank', 'noopener'); };
$('#qrCopy').onclick = () => copy(lastQR);
$('#qrX').onclick = () => { $('#qr').classList.remove('show'); setTimeout(() => lastQR = '', 3000); };
setInterval(async () => {
  if (document.hidden || !hasCam || stage.classList.contains('frozen') || !video.videoWidth) return;
  showQR(await detectQR(video, video.videoWidth, video.videoHeight));
}, 350);

window.lens = { processBlob, translate, chunks, detectQR, get busy() { return busy || trBusy; } }; // for testing
