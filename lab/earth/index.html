<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#01070c">
<title>Live Earth from Space · KSD LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../common/lab.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #map { flex: 1; background: #000; }
  .leaflet-container { font-family: var(--th); background: #000; }
  .leaflet-control-attribution { background: rgba(0, 8, 14, .75) !important; color: var(--dim) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--c) !important; }
  .leaflet-bar a { background: rgba(4, 18, 28, .9); color: var(--c); border-color: var(--line); }
  .leaflet-bar a:hover { background: #062233; }
  .leaflet-bar { border: 1px solid var(--line) !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: rgba(4, 18, 28, .96); color: var(--c2); border: 1px solid var(--c); border-radius: 2px; }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.5; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--c); }

  .hud { position: absolute; z-index: 500; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #wrap { position: relative; flex: 1; display: flex; }
  #layers { top: 10px; right: 10px; padding: 8px 10px; width: 236px; font-size: 13px; max-height: calc(100% - 140px); overflow: auto; }
  #layers h3 { margin: 4px 0 4px; font: 12px var(--mono); color: var(--dim); letter-spacing: 1px; }
  #layers label { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
  #layers input { accent-color: var(--c); }
  #layers .x { color: var(--dim); font-size: 11px; margin-left: auto; }
  #layersBtn { display: none; }
  #card { left: 10px; bottom: 74px; padding: 10px 12px; width: 280px; font-size: 13px; line-height: 1.55; }
  #card h3 { margin: 0 0 4px; font: 13px var(--mono); color: var(--c); letter-spacing: 1px; }
  #card .row { display: flex; justify-content: space-between; gap: 8px; }
  #card .row b { font-family: var(--mono); font-weight: normal; color: var(--c); }
  #card .clock { font: 24px var(--mono); color: var(--c); text-shadow: 0 0 10px var(--c); }
  #timebar { left: 10px; right: 10px; bottom: 10px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; }
  #timebar input { flex: 1; min-width: 0; }
  #timebar .d { font-family: var(--mono); color: var(--c); min-width: 116px; text-align: right; }
  #timebar .btn { padding: 4px 8px; font-size: 13px; }
  .sun-ic { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle, #fff6c0 0 30%, #ffc845 45%, rgba(255, 200, 69, 0) 72%); box-shadow: 0 0 18px #ffc845; }
  .ev-ic { width: 22px; height: 22px; display: grid; place-items: center; font-size: 15px; border-radius: 50%; background: rgba(0, 0, 0, .55); border: 1px solid var(--warn); }
  .ev-ic.storm { border-color: var(--c); }
  .ev-ic.volc { border-color: var(--bad); }
  .me-ic { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(61, 255, 154, .3), 0 0 14px var(--ok); }
  .lbl { font-family: var(--mono); font-size: 11px; color: var(--warn); text-shadow: 0 0 4px #000, 0 0 2px #000; white-space: nowrap; }

  @media (max-width: 700px) {
    #layersBtn { display: block; position: absolute; z-index: 600; top: 10px; right: 10px; }
    #layers { display: none; top: 52px; width: 230px; }
    #layers.open { display: block; }
    #card { left: 8px; right: 8px; width: auto; bottom: 64px; padding: 8px 10px; font-size: 12px; }
    #card .grid2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
    #card .clock { font-size: 18px; }
    #card.mini .more { display: none; }
    #timebar { left: 8px; right: 8px; bottom: 8px; padding: 6px 8px; gap: 6px; }
    #timebar .d { min-width: 84px; font-size: 12px; }
    .leaflet-control-zoom { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <button class="btn hud" id="layersBtn">☰ ชั้นภาพ</button>
  <div class="hud" id="layers"></div>
  <div class="hud" id="card"></div>
  <div class="hud" id="timebar">
    <button class="btn" id="prev" title="วันก่อนหน้า">◂</button>
    <input type="range" id="day" min="0" max="30" step="1" value="1" aria-label="เลือกวันที่ภาพถ่าย">
    <button class="btn" id="next" title="วันถัดไป">▸</button>
    <span class="d" id="dayLbl"></span>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
