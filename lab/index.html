<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#01070c">
<title>KSD LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common/lab.css">
<style>
  .hero { padding: 28px 16px 8px; max-width: 1200px; margin: 0 auto; }
  .hero h1 { font-family: var(--mono); font-weight: normal; font-size: 34px; letter-spacing: 6px; margin: 0; color: var(--c); text-shadow: 0 0 18px var(--c); }
  .hero p { color: var(--dim); margin: 6px 0 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--dim); margin-top: 10px; }
  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 40px; }
  h2.cat { font-family: var(--mono); font-weight: normal; color: var(--dim); letter-spacing: 2px; font-size: 14px; margin: 26px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card { position: relative; display: block; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid var(--line); padding: 14px 14px 12px; transition: .15s; overflow: hidden; }
  .card:hover { border-color: var(--c); box-shadow: 0 0 22px rgba(60, 231, 255, .2); transform: translateY(-2px); }
  .card .no { position: absolute; right: 10px; top: 8px; font-family: var(--mono); color: rgba(60, 231, 255, .35); font-size: 22px; }
  .card .ic { font-size: 28px; }
  .card b { display: block; color: var(--c2); font-size: 16px; margin: 4px 0 2px; }
  .card p { margin: 0; font-size: 13px; color: var(--dim); line-height: 1.45; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .tags span { font-size: 11px; border: 1px solid var(--line); padding: 1px 6px; color: var(--c); }
  .tags span.lan { color: var(--warn); border-color: rgba(255, 200, 69, .4); }
  .card.soon { opacity: .45; pointer-events: none; }
</style>
</head>
<body class="scanlines">
<div class="hero">
  <h1>KSD//LAB</h1>
  <p>ระบบทดลองล้ำๆ 19 ตัว · ฟรีทั้งหมด · AI ประมวลผลในเครื่อง</p>
  <div class="legend"><span>📷 กล้อง</span><span>🎤 ไมค์</span><span>📱 เซนเซอร์มือถือ</span><span>🧠 AI ในเครื่อง</span><span style="color:var(--warn)">🏠 ใช้ข้อมูลจากคอมที่ทำงาน/ตัวกลาง</span></div>
  <a class="btn" href="remote/" style="display:inline-block;margin-top:12px;text-decoration:none">🌐 ใช้จากนอกบริษัท (ฟรี) — ตั้งค่าครั้งเดียว</a>
</div>
<main id="apps"></main>
<script type="module">
const CATS = [
  ['ควบคุมด้วยร่างกาย', [
    ['holo', '🖐', 'โฮโลแกรมคุมด้วยมือ', 'จีบนิ้วหยิบ กางมือแยกชิ้นส่วน หมุนข้อมือหมุนโมเดล 3D', '📷 🧠'],
    ['airmouse', '👆', 'Air Mouse', 'ใช้ปลายนิ้วชี้-จีบคลิก-เลื่อนหน้าเว็บ ไม่ต้องแตะจอ', '📷 🧠'],
    ['airdraw', '✍️', 'วาดกลางอากาศ 3D', 'วาดเส้นแสงนีออนลอยในอากาศ แล้วหมุนดูรอบทิศ', '📷 🧠'],
    ['avatar', '🤖', 'Avatar สะท้อนท่าทาง', 'หุ่นยนต์ 3D ขยับหน้า ตา ปาก แขน ตามเรา', '📷 🧠'],
  ]],
  ['ข้อมูลโลกเรียลไทม์', [
    ['godview', '🌍', 'ศูนย์บัญชาการโลก', 'เครื่องบิน ดาวเทียม แผ่นดินไหว ไฟป่า บนลูกโลก 3D', '🏠'],
    ['overhead', '✈️', 'เรดาร์เครื่องบินเหนือหัว', 'ลำไหนบินผ่านตรงนี้ ไปไหน สูงเท่าไร', '🏠'],
    ['earth', '🛰', 'Live Earth from Space', 'ภาพโลกจากดาวเทียมรายวัน + เส้นกลางวัน-กลางคืนสด', ''],
  ]],
  ['AR / เซนเซอร์มือถือ', [
    ['sky', '🔭', 'AR ส่องท้องฟ้า', 'ยกมือถือส่องฟ้า บอกดาว ดาวเคราะห์ ISS', '📷 📱'],
    ['measure', '📏', 'AR วัดระยะ/ความสูง', 'เล็งกล้องที่พื้น-ยอด วัดระยะและความสูงด้วยมุมเอียง', '📷 📱'],
    ['seismo', '📈', 'เครื่องวัดแผ่นดินไหว', 'วางมือถือบนโต๊ะ วัดแรงสั่นแบบไซสโมกราฟ', '📱'],
  ]],
  ['เสียง / สัญญาณ', [
    ['sonar', '🦇', 'โซนาร์อัลตราโซนิก', 'จับการเคลื่อนไหว ระยะ จำนวนคน และการหายใจ ด้วยเสียงที่หูไม่ได้ยิน', '🎤'],
    ['soundlink', '📡', 'ส่งข้อมูลผ่านเสียง', 'ส่งข้อความ/ลิงก์ระหว่างเครื่องด้วยเสียงแบบ R2-D2', '🎤'],
    ['spectro', '🌈', 'Spectrogram + จำแนกเสียง', 'เห็นเสียงเป็นภาพ 3D และ AI บอกว่าเป็นเสียงอะไร', '🎤 🧠'],
  ]],
  ['AI ในเครื่อง', [
    ['jarvis', '🧠', 'JARVIS AI ในเครื่อง', 'แชทกับ AI ที่รันบนเครื่องเราเอง (WebGPU) ไม่ส่งข้อมูลออก', '🧠'],
    ['imagelab', '🎨', 'Image AI', 'ลบพื้นหลัง ขยายภาพ เปลี่ยนเป็นการ์ตูน', '🧠'],
    ['lens', '🔍', 'กล้องอ่าน + แปล', 'ส่องป้าย/เอกสาร อ่านตัวหนังสือแล้วแปลเป็นไทย', '📷 🧠'],
  ]],
  ['ใช้งานจริงในที่ทำงาน', [
    ['twin', '🏭', 'Digital Twin โรงงาน', 'อาคาร 3D รวมเครือข่าย ห้องพยาบาล สภาพอากาศ', '🏠'],
    ['safety', '🦺', 'กล้องตรวจความปลอดภัย', 'ตรวจหมวกนิรภัย เสื้อสะท้อนแสง และคนล้ม', '📷 🧠'],
    ['attendance', '🪪', 'ลงเวลาด้วยใบหน้า', 'สแกนหน้าลงเวลาเข้า-ออก เก็บข้อมูลในเครื่อง', '📷 🧠 🏠'],
  ]],
];
let n = 0;
const ready = await Promise.all(CATS.flatMap(([, apps]) => apps.map(a => fetch(a[0] + '/index.html', { method: 'HEAD' }).then(r => r.ok).catch(() => false))));
let i = 0;
document.getElementById('apps').innerHTML = CATS.map(([cat, apps]) => `<h2 class="cat">${cat}</h2><div class="grid">${apps.map(([slug, ic, name, desc, tags]) => {
  n++; const ok = ready[i++];
  return `<a class="card${ok ? '' : ' soon'}" href="${slug}/"><span class="no">${String(n).padStart(2, '0')}</span><span class="ic">${ic}</span><b>${name}</b><p>${desc}</p>
    <div class="tags">${tags.split(' ').filter(Boolean).map(t => `<span class="${t === '🏠' ? 'lan' : ''}">${t}</span>`).join('')}${ok ? '' : '<span>กำลังสร้าง</span>'}</div></a>`;
}).join('')}</div>`).join('');
</script>
</body>
</html>
